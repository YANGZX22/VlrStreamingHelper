<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VlrStreamingHelper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header>
        <h1>VlrStreamingHelper</h1>
        <p>Valorant 直播辅助功能及赛程识别导出</p>
      </header>

      <label class="toggle-row">
        <span>隐藏号角评论区</span>
        <input id="hideHaojiaoComments" type="checkbox" role="switch">
      </label>

      <label class="toggle-row">
        <span>替换 VLR 旗帜</span>
        <input id="replaceVlrFlags" type="checkbox" role="switch">
      </label>

      <section class="popup-section">
        <button id="openScheduleExport" type="button" class="primary-btn">前往赛程页</button>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
